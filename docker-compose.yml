services:
# kafka
  kafka-broker-1:
    image: apache/kafka:3.7.0
    container_name: kafka-broker-1
    ports:
      - "9092:9092"
      - "29092:29092"
    env_file:
      - .env
    networks:
      - evostream-net

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      KAFKA_CLUSTERS_0_NAME: local_kraft
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-broker-1:9092
    depends_on:
      - kafka-broker-1
    networks:
      - evostream-net

# Postgres
  db:
    image: postgres:17-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    env_file:
      - .env
    networks:
      - evostream-net

  db-admin:
    image: adminer
    container_name: db-admin
    restart: always
    depends_on: 
      - db
    ports:
      - "8000:8080"
    networks:
      - evostream-net

# Python services
  ingester:
    build: .
    container_name: app-ingester
    command: uv run python -m src.apps.ingesting
    volumes:
      - .:/app
      - /app/.venv
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-broker-1:9092
    depends_on:
      - kafka-broker-1
    networks:
      - evostream-net

  preprocessor:
    build: .
    container_name: app-preprocessor
    command: uv run python -m src.apps.preprocessing
    volumes:
      - .:/app
      - /app/.venv
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-broker-1:9092
    depends_on:
      - kafka-broker-1
    networks:
      - evostream-net

  clusterer:
    build: .
    container_name: app-clusterer
    command: uv run python -m src.apps.clustering
    volumes:
      - .:/app
      - /app/.venv
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-broker-1:9092
    depends_on:
      - kafka-broker-1
    networks:
      - evostream-net

networks:
  evostream-net:
    driver: bridge
